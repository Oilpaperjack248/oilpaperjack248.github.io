name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A8A57D: ${{ secrets.A8A57D }}
          BB22D1: ${{ secrets.BB22D1 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A8A57D', '')
          k2 = os.environ.get('BB22D1', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- d73736167e9df8f64dc372c6362a38bdc9 -->', k1) if k1 else txt
          out = out.replace('<!-- ab7749a1b2401aed3c912f -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
